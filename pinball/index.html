<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Eli · Pinball</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#07060a" />
	<link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="stylesheet" href="pinball.css" />
</head>
<body>

	<a class="skip" href="../">&larr; Back to eliarbogast.com</a>

	<main class="stage" id="stage">
		<div class="crt" id="crt">
			<canvas id="screen" width="480" height="360" aria-label="Pinball game. Use A and D (or the left and right arrow keys) for the flippers, and hold Space to launch."></canvas>
		</div>

		<!-- Info card shown when the ball hits a feature (filled in by pinball.js) -->
		<div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" hidden>
			<div class="card-bar">
				<span class="card-title" id="card-title">PROJECTS.TXT</span>
				<button type="button" class="card-x" id="card-x" aria-label="Close">&times;</button>
			</div>
			<div class="card-body" id="card-body"></div>
			<div class="card-foot">
				<button type="button" class="card-go" id="card-go">CONTINUE &#9654; <span class="key">SPACE</span></button>
			</div>
		</div>
	</main>

	<nav class="plain" aria-label="Skip the game">
		<span>No time for pinball?</span>
		<a href="../#projects">Projects</a>
		<a href="../#cv">CV</a>
		<a href="../#contact">Contact</a>
		<button type="button" id="mute">Sound: on</button>
	</nav>

	<script src="pinball.js"></script>
</body>
</html>
