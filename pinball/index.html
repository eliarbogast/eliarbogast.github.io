<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Eli · Pinball</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#07060a" />
	<link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="stylesheet" href="pinball.css?v=c587d568" />
</head>
<body>

	<a class="skip" href="../">&larr; Back to eliarbogast.com</a>

	<main class="stage" id="stage">
		<div class="crt" id="crt">
			<canvas id="screen" width="480" height="360" aria-label="Pinball game. Use A and D (or the left and right arrow keys) for the flippers, hold Space to launch, and Shift to nudge."></canvas>

			<!-- Small info panel for unlocked features; never pauses the game (filled in by pinball.js) -->
			<aside class="info" id="info" aria-live="polite" hidden>
				<div class="info-bar">
					<span id="info-title">INFO</span>
					<button type="button" class="info-x" id="info-x" aria-label="Close">&times;</button>
				</div>
				<div class="info-body" id="info-body"></div>
			</aside>
		</div>
	</main>

	<nav class="plain" aria-label="Skip the game">
		<span>No time for pinball?</span>
		<a href="../#projects">Projects</a>
		<a href="../#cv">CV</a>
		<a href="../#contact">Contact</a>
		<button type="button" id="mute">Sound: on</button>
	</nav>

	<script src="pinball.js?v=5b3ea2fc"></script>
</body>
</html>
